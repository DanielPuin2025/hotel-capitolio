<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reportes - Hotel Capitolio del Llano</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div id="sidebar-placeholder"></div>

<div class="contenido">
  <div class="topbar">
    <h5 class="m-0">Reportes</h5>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-danger btn-sm" data-bs-toggle="modal" data-bs-target="#modalEgresos" onclick="cargarEgresos()">
        <i class="bi bi-cash-stack me-1"></i>Egresos
      </button>
      <button class="btn btn-outline-dark btn-sm" data-bs-toggle="modal" data-bs-target="#modalCalendario" onclick="abrirCalendarioAnual()">
        <i class="bi bi-calendar3 me-1"></i>Calendario Anual
      </button>
    </div>
  </div>

  <div class="card card-resumen p-3 mb-3">
    <div class="row g-2 align-items-end">
      <div class="col-md-3">
        <label class="form-label">Tipo de Reporte</label>
        <select class="form-select" id="tipoReporte"><option>Ocupación</option></select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Desde</label>
        <input type="date" class="form-control" id="fechaDesde">
      </div>
      <div class="col-md-3">
        <label class="form-label">Hasta</label>
        <input type="date" class="form-control" id="fechaHasta">
      </div>
      <div class="col-md-3">
        <button class="btn btn-primary w-100" style="background:var(--azul-oscuro);border:none;" onclick="generarReporte()">Generar</button>
      </div>
    </div>
  </div>

  <div class="row g-3 mb-3">
    <div class="col-md-4">
      <div class="card card-resumen p-3">
        <small class="text-muted">% Ocupación Promedio</small>
        <h3 id="kpiOcupacionPromedio">-</h3>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card card-resumen p-3">
        <small class="text-muted">Total Ingresos</small>
        <h3 id="kpiIngresos">-</h3>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card card-resumen p-3">
        <small class="text-muted">Total Reservas</small>
        <h3 id="kpiTotalReservas">-</h3>
      </div>
    </div>
  </div>

  <div class="card card-resumen p-3">
    <h6>Ocupación por Día</h6>
    <canvas id="graficoOcupacionDiaria" height="90"></canvas>
  </div>
</div>

<div class="modal fade" id="modalEgresos" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Registrar Egreso</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formEgreso" class="row g-2 mb-3">
          <div class="col-md-4">
            <label class="form-label">Concepto</label>
            <input type="text" class="form-control" id="conceptoEgreso" placeholder="Ej: Pago proveedor" required>
          </div>
          <div class="col-md-2">
            <label class="form-label">Monto</label>
            <input type="number" class="form-control" id="montoEgreso" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Fecha</label>
            <input type="date" class="form-control" id="fechaEgreso" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Observación (opcional)</label>
            <input type="text" class="form-control" id="observacionEgreso">
          </div>
          <div class="col-12 text-end">
            <button type="button" class="btn btn-primary btn-sm" style="background:var(--azul-oscuro);border:none;" onclick="guardarEgreso()">
              <i class="bi bi-plus-lg me-1"></i>Registrar Egreso
            </button>
          </div>
        </form>

        <table class="table table-hover">
          <thead><tr><th>Fecha</th><th>Concepto</th><th>Monto</th><th>Observación</th><th>Acciones</th></tr></thead>
          <tbody id="tablaEgresos"></tbody>
        </table>
        <div class="text-end fw-bold">Total Egresos: <span id="totalEgresosGeneral" class="text-danger">$0</span></div>
      </div>
    </div>
  </div>
</div>
<div class="modal fade" id="modalCalendario" tabindex="-1">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Calendario Anual de Ingresos</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="d-flex justify-content-center align-items-center gap-3 mb-3">
          <button class="btn btn-sm btn-outline-secondary" onclick="cambiarAnioCalendario(-1)"><i class="bi bi-chevron-left"></i></button>
          <h5 class="m-0" id="anioCalendario"></h5>
          <button class="btn btn-sm btn-outline-secondary" onclick="cambiarAnioCalendario(1)"><i class="bi bi-chevron-right"></i></button>
        </div>

        <div id="resultadoDiaCalendario" class="alert alert-info text-center" style="display:none;"></div>

        <div id="calendarioAnual" class="row g-3"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/reportes.js"></script>
</body>
</html>
