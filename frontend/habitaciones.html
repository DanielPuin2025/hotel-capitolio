<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Habitaciones - Hotel Capitolio del Llano</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div id="sidebar-placeholder"></div>

<div class="contenido">
  <div class="topbar">
    <h5 class="m-0">Gestión de Habitaciones</h5>
    <button class="btn btn-primary btn-sm" style="background:var(--azul-oscuro);border:none;" data-bs-toggle="modal" data-bs-target="#modalHabitacion" onclick="abrirNueva()">
      <i class="bi bi-plus-lg me-1"></i>Nueva Habitación
    </button>
  </div>

  <div class="card card-resumen p-3">
    <table class="table table-hover">
      <thead><tr><th>Número</th><th>Tipo</th><th>Tarifa</th><th>Capacidad</th><th>Estado</th><th>Detalles</th></tr></thead>
      <tbody id="tablaHabitaciones"></tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="modalHabitacion" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="tituloModal">Nueva Habitación</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <form id="formHabitacion">
          <input type="hidden" id="habitacionId">
          <div class="mb-2"><label class="form-label">Número</label>
            <input type="text" class="form-control" id="numero" required></div>
          <div class="mb-2"><label class="form-label">Tipo</label>
            <select class="form-select" id="tipo" required>
              <option value="Sencilla">Sencilla</option>
              <option value="Doble">Doble</option>
              <option value="Triple">Triple</option>
              <option value="Suite">Suite</option>
            </select></div>
          <div class="mb-2"><label class="form-label">Tarifa</label>
            <input type="number" class="form-control" id="tarifa" required></div>
          <div class="mb-2"><label class="form-label">Capacidad</label>
            <input type="number" class="form-control" id="capacidad" required></div>
          <div class="mb-2" id="grupoEstado" style="display:none;">
            <label class="form-label">Estado</label>
            <select class="form-select" id="estado">
              <option>Disponible</option><option>Ocupada</option><option>En Limpieza</option><option>Mantenimiento</option>
            </select></div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" style="background:var(--azul-oscuro);border:none;" onclick="guardarHabitacion()">Guardar</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="modalImagen" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="tituloModalImagen">Imagen de la Habitación</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <input type="hidden" id="habitacionImagenId">
        <div class="mb-2" id="grupoSeleccionArchivo">
          <label class="form-label">Seleccione una imagen desde su computador</label>
          <input type="file" class="form-control" id="imagenArchivo" accept="image/*">
        </div>
        <div id="previsualizacion" class="text-center mt-3"></div>
      </div>
      <div class="modal-footer" id="footerModalImagen">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" style="background:var(--azul-oscuro);border:none;" onclick="guardarImagen()" id="btnSubirImagen">Subir Imagen</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/habitaciones.js"></script>
</body>
</html>
