<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Configuración - Hotel Capitolio del Llano</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div id="sidebar-placeholder"></div>

<div class="contenido">
  <div class="topbar"><h5 class="m-0">Configuración del Sistema</h5></div>

  <div class="card card-resumen p-4" style="max-width:600px;">
    <form id="formConfig">
      <div class="mb-3">
        <label class="form-label">Nombre del Hotel</label>
        <input class="form-control" id="nombreHotel">
      </div>
      <div class="mb-3">
        <label class="form-label">Dirección</label>
        <input class="form-control" id="direccionHotel">
      </div>
      <div class="mb-3">
        <label class="form-label">Teléfono</label>
        <input class="form-control" id="telefonoHotel">
      </div>
      <div class="mb-3">
        <label class="form-label">Moneda</label>
        <select class="form-select" id="monedaHotel">
          <option value="COP">Peso Colombiano (COP)</option>
          <option value="USD">Dólar (USD)</option>
        </select>
      </div>
      <button type="button" class="btn btn-primary" style="background:var(--azul-oscuro);border:none;" onclick="guardarConfig()">Guardar Cambios</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/configuracion.js"></script>
</body>
</html>
