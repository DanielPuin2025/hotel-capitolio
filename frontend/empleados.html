<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Empleados - Hotel Capitolio del Llano</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div id="sidebar-placeholder"></div>

<div class="contenido">
  <div class="topbar">
    <h5 class="m-0">Empleados</h5>
    <button class="btn btn-primary btn-sm" style="background:var(--azul-oscuro);border:none;" data-bs-toggle="modal" data-bs-target="#modalEmpleado">
      <i class="bi bi-plus-lg me-1"></i>Nuevo Empleado
    </button>
  </div>

  <div class="card card-resumen p-3">
    <table class="table table-hover">
      <thead><tr><th>Nombre</th><th>Cargo</th><th>Usuario</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr></thead>
      <tbody id="tablaEmpleados"></tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="modalEmpleado" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Nuevo Empleado</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <form id="formEmpleado">
          <div class="mb-2"><label class="form-label">Nombre</label><input class="form-control" id="nombreEmp" required></div>
          <div class="mb-2"><label class="form-label">Cargo</label><input class="form-control" id="cargoEmp" required></div>
          <div class="mb-2"><label class="form-label">Usuario</label><input class="form-control" id="usuarioEmp" required></div>
                    <div class="mb-2"><label class="form-label">Contraseña</label><input type="password" class="form-control" id="passwordEmp" required autocomplete="new-password"></div>
          <div class="mb-2"><label class="form-label">Rol</label>
            <select class="form-select" id="rolEmp">
              <option value="Recepcionista">Recepcionista</option>
              <option value="Administrador">Administrador</option>
            </select></div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" style="background:var(--azul-oscuro);border:none;" onclick="guardarEmpleado()">Guardar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/empleados.js"></script>
</body>
</html>
