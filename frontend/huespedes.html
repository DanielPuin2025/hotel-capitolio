<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Huéspedes - Hotel Capitolio del Llano</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div id="sidebar-placeholder"></div>

<div class="contenido">
  <div class="topbar">
    <h5 class="m-0">Huéspedes</h5>
    <button class="btn btn-primary btn-sm" style="background:var(--azul-oscuro);border:none;" data-bs-toggle="modal" data-bs-target="#modalHuesped">
      <i class="bi bi-plus-lg me-1"></i>Nuevo Huésped
    </button>
  </div>

  <div class="card card-resumen p-3 mb-3">
    <label class="form-label">Buscar por nombre</label>
    <input type="text" class="form-control" id="buscarNombreHuesped" placeholder="Escriba el nombre del huésped...">
  </div>

 <div class="card card-resumen p-3">
    <table class="table table-hover">
      <thead><tr><th>Nombre</th><th>Documento</th><th>Teléfono</th><th>Profesión</th><th>Procedencia</th><th>Habitación</th><th>Acciones</th></tr></thead>
      <tbody id="tablaHuespedes"></tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="modalHuesped" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Nuevo Huésped</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <form id="formHuesped">
          <div class="mb-2"><label class="form-label">Nombre</label><input class="form-control" id="nombre" required></div>
          <div class="mb-2"><label class="form-label">Documento</label><input class="form-control" id="documento" required></div>
          <div class="mb-2"><label class="form-label">Teléfono</label><input class="form-control" id="telefono"></div>
          <div class="mb-2"><label class="form-label">Profesión</label><input type="text" class="form-control" id="profesion" placeholder="Escriba la profesión"></div>
          <div class="mb-2"><label class="form-label">Procedencia</label><input class="form-control" id="procedencia"></div>
          <div class="mb-2">
            <label class="form-label">Habitación</label>
            <select class="form-select" id="habitacionAsignada" required>
              <option value="">Seleccione una habitación</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" style="background:var(--azul-oscuro);border:none;" onclick="guardarHuesped()">Guardar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/huespedes.js"></script>
</body>
</html>
