<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard - Hotel Capitolio del Llano</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div id="sidebar-placeholder"></div>

<div class="contenido">
  <div class="topbar">
    <h5 class="m-0">Dashboard</h5>
    <div><i class="bi bi-person-circle me-2"></i><span id="nombreUsuario"></span></div>
  </div>

  <div class="row g-3 mb-3">
    <div class="col-md-3">
      <div class="card card-resumen p-3">
        <div class="d-flex justify-content-between">
          <div><small class="text-muted">Habitaciones Disponibles</small><h3 id="kpiDisponibles">-</h3></div>
          <div class="icono" style="background:#e8f8ef;color:var(--verde);"><i class="bi bi-door-open"></i></div>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card card-resumen p-3">
        <div class="d-flex justify-content-between">
          <div><small class="text-muted">Habitaciones Ocupadas</small><h3 id="kpiOcupadas">-</h3></div>
          <div class="icono" style="background:#eaf1fb;color:#3b7dd8;"><i class="bi bi-door-closed"></i></div>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card card-resumen p-3">
        <div class="d-flex justify-content-between">
          <div><small class="text-muted">Reservas Hoy</small><h3 id="kpiReservas">-</h3></div>
          <div class="icono" style="background:#f2eafc;color:#8e44ad;"><i class="bi bi-calendar-check"></i></div>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card card-resumen p-3">
        <div class="d-flex justify-content-between">
          <div><small class="text-muted">Check-in Hoy</small><h3 id="kpiCheckin">-</h3></div>
          <div class="icono" style="background:#fdf3e3;color:#e6a23c;"><i class="bi bi-box-arrow-in-right"></i></div>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-md-4">
      <div class="card card-resumen p-3">
        <h6>Ocupación Actual</h6>
        <canvas id="graficoOcupacion" height="220"></canvas>
      </div>
    </div>
    <div class="col-md-8">
      <div class="card card-resumen p-3">
        <h6>Reservas Próximas</h6>
        <table class="table table-sm">
          <thead><tr><th>Huésped</th><th>Entrada</th><th>Salida</th><th>Habitación</th><th>Estado</th></tr></thead>
          <tbody id="tablaReservasProximas"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
