<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Check-in / Check-out - Hotel Capitolio del Llano</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div id="sidebar-placeholder"></div>

<div class="contenido">
  <div class="topbar"><h5 class="m-0">Check-in / Check-out</h5></div>

  <ul class="nav nav-tabs mb-3">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabCheckin">Check-in para Reservas</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabCheckout">Check-out</button></li>
  </ul>

  <div class="tab-content">
    <div class="tab-pane fade show active" id="tabCheckin">
      <div class="card card-resumen p-3" style="max-width:600px;">
        <div class="mb-2">
          <label class="form-label">Reserva</label>
          <select class="form-select" id="reservaSelect"></select>
        </div>
        <div class="mb-2">
          <label class="form-label">Documento</label>
          <input class="form-control" id="documentoCheckin" placeholder="Número de documento">
        </div>
        <div class="mb-3">
          <label class="form-label">Firma (opcional)</label>
          <input class="form-control" id="firmaCheckin" placeholder="Firmar aquí">
        </div>
        <button class="btn btn-primary" style="background:var(--azul-oscuro);border:none;" onclick="realizarCheckin()">Realizar Check-in</button>
      </div>
    </div>

    <div class="tab-pane fade" id="tabCheckout">
      <div class="card card-resumen p-3">
        <table class="table table-hover">
          <thead><tr><th>Huésped</th><th>Habitación</th><th>Check-in</th><th>Check-out</th><th>Acción</th></tr></thead>
          <tbody id="tablaCheckout"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/checkin.js"></script>
</body>
</html>
